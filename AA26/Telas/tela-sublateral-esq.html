<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sub-Lateral Esquerda — Armindo Awards '26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:        #c9a84c;
      --gold-bright: #ffd700;
      --cyan:        #00f5ff;
      --magenta:     #ff007f;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000000; cursor: none; user-select: none; -webkit-user-select: none; }

    /* Clean background PNG */
    #bg-layer {
      position: fixed; inset: 0; z-index: 0;
      background: #000000 url('fundos/Sub lateral.png') center center / cover no-repeat;
      transition: opacity 0.8s ease;
    }

    #particle-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    /* Jeoparty overlay */
    #jeoparty-overlay {
      position: fixed; inset: 0; z-index: 10;
      background: #06040d;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.8s ease;
      padding: 5vmin;
      gap: 4vmin;
    }
    #jeoparty-overlay.visible { opacity: 1; }

    .jeoparty-brand {
      display: flex; flex-direction: column; align-items: center; gap: 1.5vmin;
      margin-bottom: 2vmin;
    }
    .jb-label {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(0.7rem, 3vw, 1.5rem); font-weight: 700;
      text-transform: uppercase; letter-spacing: 4px;
      color: rgba(201,168,76,0.85);
    }
    .jb-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.5rem, 7vw, 4rem); font-weight: 900;
      text-transform: uppercase; letter-spacing: 2px;
      text-align: center; line-height: 1.1;
      color: var(--gold-bright);
    }

    .gold-divider { width: 70%; height: 1px; background: rgba(201,168,76,0.4); }

    .mini-scores { display: flex; flex-direction: column; gap: 1.8vmin; width: 100%; }
    .mini-score-row {
      display: flex; align-items: center; gap: 2vmin;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-left: 3px solid transparent; border-radius: 10px;
      padding: 2.5vmin 3vmin;
    }
    .mini-rank { font-family: 'Space Grotesk', sans-serif; font-size: clamp(0.9rem, 3.5vw, 2rem); font-weight: 900; color: rgba(255,255,255,0.25); min-width: 1.2em; text-align: center; }
    .mini-rank.first  { color: #ffd700; }
    .mini-rank.second { color: #c0c0c0; }
    .mini-rank.third  { color: #cd7f32; }
    .mini-swatch { width: clamp(8px,2.5vmin,14px); height: clamp(8px,2.5vmin,14px); border-radius: 50%; flex-shrink: 0; }
    .mini-name   { flex:1; font-family: 'Outfit', sans-serif; font-size: clamp(0.9rem, 3.2vw, 1.8rem); font-weight: 800; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-pts    { font-family: 'Space Grotesk', sans-serif; font-size: clamp(0.9rem, 3.2vw, 1.8rem); font-weight: 700; color: #ffd700; }
  </style>
</head>
<body>

  <div id="bg-layer"></div>
  <canvas id="particle-canvas"></canvas>

  <div id="jeoparty-overlay">
    <div class="jeoparty-brand">
      <div class="jb-label">Armindo</div>
      <div class="jb-title">Awards<br>'26</div>
    </div>
    <div class="gold-divider"></div>
    <div class="mini-scores" id="mini-scores"></div>
  </div>

  <script type="module">
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, pts = [];
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    class P {
      constructor() { this.reset(); }
      reset() { this.x=Math.random()*W; this.y=H+20; this.vx=(Math.random()-0.5)*0.2; this.vy=-(Math.random()*0.35+0.1); this.r=Math.random()*1.2+0.3; this.a=Math.random()*0.35+0.1; this.da=-0.0005; }
      tick() { this.x+=this.vx; this.y+=this.vy; this.a+=this.da; if(this.a<=0||this.y<-10) this.reset(); }
      draw() { ctx.save(); ctx.globalAlpha=Math.max(0,this.a); ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); ctx.restore(); }
    }
    for(let i=0;i<25;i++){const p=new P();p.y=Math.random()*H;pts.push(p);}
    (function loop(){ctx.clearRect(0,0,W,H);pts.forEach(p=>{p.tick();p.draw();});requestAnimationFrame(loop);})();

    import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    const FB_CFG = { apiKey:"AIzaSyA8azNy6GEgD190y_fW91ahUbKa1w5veik", authDomain:"aawards.firebaseapp.com", databaseURL:"https://aawards-default-rtdb.firebaseio.com", projectId:"aawards", storageBucket:"aawards.firebasestorage.app", messagingSenderId:"839334918366", appId:"1:839334918366:web:454a259fa3e2665b46ea4f" };
    const db = getDatabase(initializeApp(FB_CFG));
    let lastState={}, telaMode='idle';

    onValue(ref(db,'jeoparty/session'), snap=>{
      const val=snap.val()||{};
      lastState=val.gameState||{};
      applyMode();
    });
    onValue(ref(db,'telas/sublateral_esq'), snap=>{ telaMode=snap.val()||'idle'; applyMode(); });

    function applyMode() {
      const bg=document.getElementById('bg-layer');
      const jp=document.getElementById('jeoparty-overlay');
      const isGameActive = lastState.gameStarted === true;
      const isAuto       = telaMode === 'auto';
      const isBranding   = telaMode === 'branding' || (isAuto && isGameActive);
      const isIdle       = telaMode === 'idle' || !isBranding;

      bg.style.opacity = isIdle ? '1' : '0';
      jp.classList.toggle('visible', isBranding);

      if(isBranding) renderMiniScores(lastState);
    }

    function renderMiniScores(state) {
      const teams=[...(state.teams||[])].sort((a,b)=>(b.score||0)-(a.score||0));
      const ranks=['first','second','third'];
      document.getElementById('mini-scores').innerHTML=teams.map((t,i)=>`
        <div class="mini-score-row" style="border-left-color:${t.color||'#ccc'}">
          <div class="mini-rank ${ranks[i]||''}">${i+1}</div>
          <div class="mini-swatch" style="background:${t.color||'#ccc'}"></div>
          <div class="mini-name">${t.name}</div>
          <div class="mini-pts">${(t.score||0).toLocaleString('pt-PT')}€</div>
        </div>`).join('');
    }
  </script>
</body>
</html>
