<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lateral Direita — Armindo Awards '26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:        #c9a84c;
      --gold-bright: #ffd700;
      --cyan:        #00f5ff;
      --magenta:     #ff007f;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000000; cursor: none; user-select: none; -webkit-user-select: none; }

    #bg-layer {
      position: fixed; inset: 0; z-index: 0;
      background: #000000 url('fundos/Lateral Direito.png') center center / cover no-repeat;
      transition: opacity 0.8s ease;
    }
    #particle-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    #jeoparty-overlay {
      position: fixed; inset: 0; z-index: 10;
      background: #06040d;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.8s ease;
      padding: 6vmin 5vmin;
    }
    #jeoparty-overlay.visible { opacity: 1; }

    .scores-header {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.2rem, 4vw, 2.5rem); font-weight: 900; letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin-bottom: 5vmin; text-align: center;
    }
    .scores-list { display: flex; flex-direction: column; gap: 2.5vmin; width: 100%; }
    .score-row {
      display: flex; align-items: center; gap: 3vmin;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-left: 4px solid transparent; border-radius: 14px; padding: 3.5vmin 4vmin;
    }
    .score-rank { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.5rem, 5vw, 3rem); font-weight: 900; color: rgba(255,255,255,0.25); min-width: 1.5em; text-align: center; }
    .score-rank.first  { color: var(--gold-bright); }
    .score-rank.second { color: #c0c0c0; }
    .score-rank.third  { color: #cd7f32; }
    .score-swatch { width: clamp(12px,3vmin,20px); height: clamp(12px,3vmin,20px); border-radius: 50%; flex-shrink: 0; }
    .score-name { flex:1; font-family: 'Outfit', sans-serif; font-size: clamp(1rem, 3.5vw, 2rem); font-weight: 800; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .score-pts  { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1rem, 3.5vw, 2rem); font-weight: 700; color: var(--gold-bright); }

    #cat-overlay {
      position: fixed; inset: 0; z-index: 10;
      background: #06040d;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.8s ease;
      padding: 6vmin; gap: 4vmin;
    }
    #cat-overlay.visible { opacity: 1; }
    .cat-label { font-family: 'Outfit', sans-serif; font-size: clamp(0.9rem, 3vw, 1.5rem); font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--cyan); opacity: 0.8; }
    .cat-name  { font-family: 'Outfit', sans-serif; font-size: clamp(2rem, 8vw, 5rem); font-weight: 900; text-align: center; color: #fff; line-height: 1.1; }
    .cat-pts   { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.5rem, 6vw, 4rem); font-weight: 700; color: var(--gold-bright); }
    .gold-divider { width: 60%; height: 1px; background: rgba(201,168,76,0.4); margin: 3vmin auto; }
  </style>
</head>
<body>
  <div id="bg-layer"></div>
  <canvas id="particle-canvas"></canvas>

  <div id="jeoparty-overlay">
    <div class="scores-header">🏆 Pontuações</div>
    <div class="scores-list" id="scores-list"></div>
    <div class="gold-divider"></div>
  </div>

  <div id="cat-overlay">
    <div class="cat-label">Categoria Ativa</div>
    <div class="cat-name" id="cat-name">—</div>
    <div class="gold-divider"></div>
    <div class="cat-pts" id="cat-pts"></div>
  </div>

  <script type="module">
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, pts = [];
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    class P {
      constructor() { this.reset(); }
      reset() { this.x=Math.random()*W; this.y=H+20; this.vx=(Math.random()-0.5)*0.25; this.vy=-(Math.random()*0.4+0.1); this.r=Math.random()*1.3+0.3; this.a=Math.random()*0.4+0.1; this.da=-0.0005; }
      tick() { this.x+=this.vx; this.y+=this.vy; this.a+=this.da; if(this.a<=0||this.y<-10) this.reset(); }
      draw() { ctx.save(); ctx.globalAlpha=Math.max(0,this.a); ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); ctx.restore(); }
    }
    for(let i=0;i<30;i++){const p=new P();p.y=Math.random()*H;pts.push(p);}
    (function loop(){ctx.clearRect(0,0,W,H);pts.forEach(p=>{p.tick();p.draw();});requestAnimationFrame(loop);})();

    import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    const FB_CFG = { apiKey:"AIzaSyA8azNy6GEgD190y_fW91ahUbKa1w5veik", authDomain:"aawards.firebaseapp.com", databaseURL:"https://aawards-default-rtdb.firebaseio.com", projectId:"aawards", storageBucket:"aawards.firebasestorage.app", messagingSenderId:"839334918366", appId:"1:839334918366:web:454a259fa3e2665b46ea4f" };
    const db = getDatabase(initializeApp(FB_CFG));
    let currentConfig={}, lastState={}, telaMode='idle';

    onValue(ref(db,'jeoparty/session'), snap=>{
      const val=snap.val()||{};
      currentConfig=val.gameConfig||{}; lastState=val.gameState||{};
      applyMode();
    });
    onValue(ref(db,'telas/lateral_dir'), snap=>{ telaMode=snap.val()||'idle'; applyMode(); });

    function applyMode() {
      const bg=document.getElementById('bg-layer');
      const jp=document.getElementById('jeoparty-overlay');
      const ca=document.getElementById('cat-overlay');
      const isGameActive = lastState.gameStarted === true;
      const isAuto       = telaMode === 'auto';
      const isScores     = telaMode === 'scores' || (isAuto && isGameActive);
      const isCategory   = telaMode === 'category' && lastState.activeQuestion;
      const isIdle       = telaMode === 'idle' || (!isScores && !isCategory);

      bg.style.opacity = isIdle ? '1' : '0';
      jp.classList.toggle('visible', isScores);
      ca.classList.toggle('visible', isCategory);
      if(isScores)   renderScores(lastState);
      if(isCategory) renderCategory(lastState);
    }

    function renderScores(state) {
      const teams=[...(state.teams||[])].sort((a,b)=>(b.score||0)-(a.score||0));
      const ranks=['first','second','third'];
      document.getElementById('scores-list').innerHTML=teams.map((t,i)=>`
        <div class="score-row" style="border-left-color:${t.color||'#ccc'}">
          <div class="score-rank ${ranks[i]||''}">${i+1}</div>
          <div class="score-swatch" style="background:${t.color||'#ccc'}"></div>
          <div class="score-name">${t.name}</div>
          <div class="score-pts">${(t.score||0).toLocaleString('pt-PT')}€</div>
        </div>`).join('');
    }

    function renderCategory(state) {
      const qi=state.activeQuestion||{};
      const cat=currentConfig.categories?.[qi.categoryIndex];
      const q=cat?.questions?.[qi.questionIndex];
      document.getElementById('cat-name').textContent=cat?.name||'—';
      document.getElementById('cat-pts').textContent=q?`${q.value||(qi.questionIndex+1)*200}€`:'';
    }
  </script>
</body>
</html>
