<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lateral Direita — Armindo Awards '26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:        #c9a84c;
      --gold-bright: #ffd700;
      --cyan:        #00f5ff;
      --magenta:     #ff007f;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; user-select: none; -webkit-user-select: none; }

    #bg-layer {
      position: fixed; inset: 0; z-index: 0;
      background: url('fundos/Lateral Direito.png') center center / cover no-repeat;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #particle-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    #vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse 80% 120% at center, transparent 40%, rgba(0,0,0,0.5) 100%);
    }
    #glow-border { position: fixed; inset: 0; z-index: 3; pointer-events: none; animation: borderPulse 4s ease-in-out infinite alternate; }
    @keyframes borderPulse {
      0%   { box-shadow: inset 0 0 50px rgba(201,168,76,0.10), inset 0 0 100px rgba(201,168,76,0.04); }
      100% { box-shadow: inset 0 0 70px rgba(201,168,76,0.20), inset 0 0 140px rgba(201,168,76,0.09); }
    }
    #scanlines {
      position: fixed; inset: 0; z-index: 4; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }

    /* Jeoparty overlay */
    #jeoparty-overlay {
      position: fixed; inset: 0; z-index: 10;
      background: radial-gradient(ellipse at 50% 30%, #140d2e 0%, #07060a 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 6vmin 5vmin;
    }
    #jeoparty-overlay.visible { opacity: 1; }

    .scores-header {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.2rem, 4vw, 2.5rem); font-weight: 900; letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(to right, var(--gold-bright), #ff8c00);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 5vmin; text-align: center;
    }
    .scores-list { display: flex; flex-direction: column; gap: 2.5vmin; width: 100%; }
    .score-row {
      display: flex; align-items: center; gap: 3vmin;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-left: 4px solid transparent; border-radius: 14px; padding: 3.5vmin 4vmin;
      animation: rowSlide 0.6s cubic-bezier(0.25, 1, 0.5, 1) both;
    }
    @keyframes rowSlide {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .score-rank { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.5rem, 5vw, 3rem); font-weight: 900; color: rgba(255,255,255,0.25); min-width: 1.5em; text-align: center; }
    .score-rank.first  { color: var(--gold-bright); }
    .score-rank.second { color: #c0c0c0; }
    .score-rank.third  { color: #cd7f32; }
    .score-swatch { width: clamp(12px,3vmin,20px); height: clamp(12px,3vmin,20px); border-radius: 50%; flex-shrink: 0; }
    .score-name { flex:1; font-family: 'Outfit', sans-serif; font-size: clamp(1rem, 3.5vw, 2rem); font-weight: 800; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .score-pts  { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1rem, 3.5vw, 2rem); font-weight: 700; color: var(--gold-bright); }

    /* Category overlay */
    #cat-overlay {
      position: fixed; inset: 0; z-index: 10;
      background: radial-gradient(ellipse at 50% 30%, #0a1a2e 0%, #07060a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 6vmin; gap: 4vmin;
    }
    #cat-overlay.visible { opacity: 1; }
    .cat-label { font-family: 'Outfit', sans-serif; font-size: clamp(0.9rem, 3vw, 1.5rem); font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--cyan); opacity: 0.8; }
    .cat-name  { font-family: 'Outfit', sans-serif; font-size: clamp(2rem, 8vw, 5rem); font-weight: 900; text-align: center; color: #fff; text-shadow: 0 0 40px rgba(0,245,255,0.3); line-height: 1.1; }
    .cat-pts   { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.5rem, 6vw, 4rem); font-weight: 700; color: var(--gold-bright); text-shadow: 0 0 25px rgba(255,215,0,0.4); }
    .gold-divider { width: 60%; height: 1px; background: linear-gradient(to right, transparent, var(--gold-bright), transparent); margin: 3vmin auto; opacity: 0.5; }

    .jg1 { position: fixed; width: 60vw; height: 60vw; border-radius: 50%; background: radial-gradient(circle, rgba(138,43,226,0.15) 0%, transparent 70%); top: -20vw; right: -10vw; pointer-events: none; z-index: 0; animation: blobFloat 18s ease-in-out infinite alternate; }
    .jg2 { position: fixed; width: 50vw; height: 50vw; border-radius: 50%; background: radial-gradient(circle, rgba(0,245,255,0.08) 0%, transparent 70%); bottom: -15vw; left: -10vw; pointer-events: none; z-index: 0; animation: blobFloat 14s ease-in-out infinite alternate-reverse; }
    @keyframes blobFloat { from { transform: translate(0,0) scale(1); } to { transform: translate(20px,15px) scale(1.08); } }

    .brand-footer { position: fixed; bottom: 5vmin; left: 0; right: 0; text-align: center; z-index: 11; font-family: 'Outfit', sans-serif; font-size: clamp(0.6rem, 2.5vw, 1.2rem); font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(201,168,76,0.5); }
  </style>
</head>
<body>
  <div class="jg1"></div>
  <div class="jg2"></div>
  <div id="bg-layer"></div>
  <canvas id="particle-canvas"></canvas>
  <div id="vignette"></div>
  <div id="glow-border"></div>
  <div id="scanlines"></div>

  <div id="jeoparty-overlay">
    <div class="scores-header">🏆 Pontuações</div>
    <div class="scores-list" id="scores-list"></div>
    <div class="gold-divider"></div>
  </div>

  <div id="cat-overlay">
    <div class="cat-label">Categoria Ativa</div>
    <div class="cat-name" id="cat-name">—</div>
    <div class="gold-divider"></div>
    <div class="cat-pts" id="cat-pts"></div>
  </div>

  <div class="brand-footer">Armindo Awards · 2026</div>

  <script type="module">
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, pts = [];
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    class P {
      constructor() { this.reset(); }
      reset() { this.x=Math.random()*W; this.y=H+20; this.vx=(Math.random()-0.5)*0.3; this.vy=-(Math.random()*0.5+0.15); this.r=Math.random()*2+0.5; this.a=Math.random()*0.5+0.2; this.da=-0.0006; }
      tick() { this.x+=this.vx; this.y+=this.vy; this.a+=this.da; if(this.a<=0||this.y<-10) this.reset(); }
      draw() { ctx.save(); ctx.globalAlpha=Math.max(0,this.a); ctx.fillStyle='#c9a84c'; ctx.shadowBlur=6; ctx.shadowColor='#c9a84c'; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); ctx.restore(); }
    }
    for(let i=0;i<50;i++){const p=new P();p.y=Math.random()*H;pts.push(p);}
    (function loop(){ctx.clearRect(0,0,W,H);pts.forEach(p=>{p.tick();p.draw();});requestAnimationFrame(loop);})();

    import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    const FB_CFG = { apiKey:"AIzaSyA8azNy6GEgD190y_fW91ahUbKa1w5veik", authDomain:"aawards.firebaseapp.com", databaseURL:"https://aawards-default-rtdb.firebaseio.com", projectId:"aawards", storageBucket:"aawards.firebasestorage.app", messagingSenderId:"839334918366", appId:"1:839334918366:web:454a259fa3e2665b46ea4f" };
    const db = getDatabase(initializeApp(FB_CFG));
    let currentConfig={}, lastState={}, telaMode='idle';

    onValue(ref(db,'jeoparty/session'), snap=>{
      const val=snap.val()||{};
      currentConfig=val.gameConfig||{}; lastState=val.gameState||{};
      applyMode();
    });
    onValue(ref(db,'telas/lateral_dir'), snap=>{ telaMode=snap.val()||'idle'; applyMode(); });

    function applyMode() {
      const bg=document.getElementById('bg-layer');
      const jp=document.getElementById('jeoparty-overlay');
      const ca=document.getElementById('cat-overlay');
      const showBg = telaMode==='idle' || (!lastState.gameStarted && !lastState.lobbyActive);
      bg.style.opacity = showBg ? '1' : '0.06';
      const showScores = !showBg && (telaMode==='scores'||telaMode==='auto') && lastState.gameStarted;
      const showCat    = !showBg && telaMode==='category' && lastState.activeQuestion;
      jp.classList.toggle('visible', showScores);
      ca.classList.toggle('visible', showCat);
      if(showScores) renderScores(lastState);
      if(showCat)    renderCategory(lastState);
    }

    function renderScores(state) {
      const teams=[...(state.teams||[])].sort((a,b)=>(b.score||0)-(a.score||0));
      const ranks=['first','second','third'];
      document.getElementById('scores-list').innerHTML=teams.map((t,i)=>`
        <div class="score-row" style="animation-delay:${i*0.08}s; border-left-color:${t.color||'#ccc'}">
          <div class="score-rank ${ranks[i]||''}">${i+1}</div>
          <div class="score-swatch" style="background:${t.color||'#ccc'}"></div>
          <div class="score-name">${t.name}</div>
          <div class="score-pts">${(t.score||0).toLocaleString('pt-PT')}€</div>
        </div>`).join('');
    }

    function renderCategory(state) {
      const qi=state.activeQuestion||{};
      const cat=currentConfig.categories?.[qi.categoryIndex];
      const q=cat?.questions?.[qi.questionIndex];
      document.getElementById('cat-name').textContent=cat?.name||'—';
      document.getElementById('cat-pts').textContent=q?`${q.value||(qi.questionIndex+1)*200}€`:'';
    }
  </script>
</body>
</html>
